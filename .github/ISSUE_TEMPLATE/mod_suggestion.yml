name: 💡 Mod Suggestion
description: Suggest a new mod to be included in Aura Modpack
labels: ["mod suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Suggesting a mod for Aura Modpack? Please make sure it supports Fabric 1.20.1!
  - type: input
    id: mod_name
    attributes:
      label: Mod Name
      placeholder: e.g. "Do a Barrel Roll"
    validations:
      required: true
  - type: input
    id: mod_link
    attributes:
      label: Mod Link (Modrinth or CurseForge)
      placeholder: https://modrinth.com/mod/...
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why should this mod be added?
      description: Explain how it improves gameplay, performance, or immersion.
    validations:
      required: true
  - type: textarea
    id: performance_impact
    attributes:
      label: Performance Impact
      description: Any notes on FPS or TPS performance during testing.
